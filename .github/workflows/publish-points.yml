name: Publish points summary

on:
  workflow_run:
    workflows: ["Run Microsoft Rewards Script"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract summary from run log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo biin95/Microsoft-Rewards-Script --workflow run.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Using RUN_ID=$RUN_ID"
          gh run view "$RUN_ID" --repo biin95/Microsoft-Rewards-Script --log > run.log 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, re, datetime
          try:
              log = open('run.log', errors='ignore').read()
          except Exception:
              log = ''
          def grab(p):
              m = re.findall(p, log)
              return m[-1] if m else None
          bj = datetime.timezone(datetime.timedelta(hours=8))
          now_bj = datetime.datetime.now(bj)
          data = {
              "date": now_bj.strftime('%F'),
              "checked_at": now_bj.strftime('%m-%d %H:%M'),
              "local_time": now_bj.strftime('%m-%d %H:%M'),
              "balance": grab(r'currentBalance=(\d+)'),
              "gained": grab(r'pointsGained=(\d+)'),
              "tasks_done": grab(r'activities:\s*(\d+) completed'),
              "tasks_total": None,
              "runtime_min": grab(r'runtimeMinutes=([\d.]+)'),
              "status": grab(r'RUN-END.*?status=(\w+)') or 'unknown',
          }
          inc = grab(r'activities:\s*\d+ completed,\s*(\d+) incomplete')
          if inc is not None and data["tasks_total"] is None and data["tasks_done"] is not None:
              data["tasks_total"] = str(int(data["tasks_done"]) + int(inc))
          json.dump(data, open('data.json', 'w'), ensure_ascii=False)
          print(json.dumps(data, ensure_ascii=False))
          PYEOF
      - name: Commit points.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          B64=$(base64 -w0 data.json)
          for i in 1 2 3; do
            SHA=""
            SHA=$(gh api "repos/$REPO/contents/data/points.json" --jq .sha 2>/dev/null) || SHA=""
            ARGS=(-X PUT "repos/$REPO/contents/data/points.json"
                  -f message="points $(date -u +%F) (attempt $i)"
                  -f content="$B64")
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            if ERR=$(gh api "${ARGS[@]}" 2>&1); then
              echo "published (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed: $ERR"
            sleep 15
          done
          echo "all 3 attempts failed"
          exit 1
      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: points
          path: data.json
