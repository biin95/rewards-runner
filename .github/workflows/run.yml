name: Run Microsoft Rewards Script

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore sessions cache
        uses: actions/cache/restore@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
          restore-keys: |
            sessions-

      - name: Restore sessions from secret (first run)
        run: |
          if [ ! -d sessions ] && [ -n "${{ secrets.SESSIONS_B64 }}" ]; then
            echo "${{ secrets.SESSIONS_B64 }}" | base64 -d | tar xzf -
            echo "sessions restored (file count: $(ls sessions 2>/dev/null | wc -l))"
          else
            echo "no secret session to restore (dir exists: $( [ -d sessions ] && echo yes || echo no ))"
          fi

      - name: Install & build
        run: |
          npm run pre-build
          npm run build

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE_B64 }}" | base64 -d > .env

      - name: Mask account identifiers in logs
        run: |
          grep -oiE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+' .env 2>/dev/null | sort -u | while read -r e; do
            [ -n "$e" ] && echo "::add-mask::$e"
          done

      - name: Run script
        run: npm start

      - name: Save sessions cache
        uses: actions/cache/save@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
