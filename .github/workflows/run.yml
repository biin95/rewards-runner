name: Run Microsoft Rewards Script

on:
  schedule:
    # UTC 08:45 = 北京时间 16:45（微软积分日切点 PT 00:00 = UTC 08:00 之后）
    # 双 cron 冗余：GitHub 对低活跃 fork 的 schedule 会延迟甚至丢弃，第二条兜底。
    # 重复运行无害：已完成任务会被脚本跳过，第二次运行主要补漏。
    - cron: '45 8 * * *'
    - cron: '45 9 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore sessions cache
        uses: actions/cache/restore@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
          restore-keys: |
            sessions-

      - name: Restore sessions from secret (first run)
        run: |
          if [ ! -d sessions ] && [ -n "${{ secrets.SESSIONS_B64 }}" ]; then
            echo "${{ secrets.SESSIONS_B64 }}" | base64 -d | tar xzf -
            echo "sessions restored from secret:"
            ls -la sessions
          else
            echo "no secret session to restore (dir exists: $( [ -d sessions ] && echo yes || echo no ))"
          fi

      - name: Install & build
        run: |
          npm run pre-build
          npm run build

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE_B64 }}" | base64 -d > .env

      - name: Run script
        run: npm start

      - name: Save sessions cache
        uses: actions/cache/save@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
